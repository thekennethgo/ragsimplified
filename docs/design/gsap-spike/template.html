<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GSAP Room Test</title>
<style>
  :root { --bg:#1E1611; --panel:#2B1F17; --ink:#EADAC0; --muted:#B8A48A; --accent:#C98F4A; --line:#4A3324; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui, sans-serif; }
  main { max-width:1280px; margin:0 auto; padding:12px 16px; }
  #stage svg { width:100%; height:auto; display:block; border-radius:6px; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:10px 0; }
  button { background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:6px 12px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.evt { border-color:var(--accent); }
  label { color:var(--muted); display:flex; gap:4px; align-items:center; }
  #status { font-family:ui-monospace, monospace; color:var(--muted); }
  #log { font:12px/1.5 ui-monospace, monospace; color:var(--muted); background:var(--panel); border-radius:6px; padding:8px 10px; height:140px; overflow:auto; white-space:pre; }
</style>
</head>
<body>
<main>
  <div id="stage">{{SVG}}</div>
  <div class="bar">
    <button class="evt" data-evt="chopper_start">chopper start</button>
    <button class="evt" data-evt="chopper_done">chopper done</button>
    <button class="evt" data-evt="translator_start">translator start</button>
    <button class="evt" data-evt="translator_done">translator done</button>
    <button class="evt" data-evt="archivist_start">archivist start</button>
    <button class="evt" data-evt="archivist_done">archivist done</button>
  </div>
  <div class="bar">
    <button id="burst">fire all 6 at once</button>
    <button id="reset">reset</button>
    <label><input type="checkbox" id="rm"> reduced motion</label>
    <label><input type="checkbox" id="spots"> show spots</label>
    <span id="status"></span>
  </div>
  <div id="log"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const MIN_HOLD = 1.0;   // seconds each scene's end state stays on screen
const WALK_SPEED = 90;  // room units per second
const EVENTS = ['chopper_start', 'chopper_done', 'translator_start', 'translator_done', 'archivist_start', 'archivist_done'];

// Feet positions in room coordinates. *Spot = the spots in the SVG; the rest are walk targets.
const P = {
  chSpot: { x: 416, y: 434 }, chInbox: { x: 300, y: 474 }, chTray: { x: 604, y: 326 },
  trSpot: { x: 664, y: 358 }, trStamp: { x: 764.8, y: 376.4 },
  arSpot: { x: 1040, y: 470 }, arAround: { x: 960, y: 500 }, arTable: { x: 856, y: 388 },
};
// Characters are 80x120 boxes with feet at (40,116).
const at = (p) => ({ x: p.x - 40, y: p.y - 116 });
const PRINTOUT_ON_TABLE = { x: 58.8, y: -5.8 };
const BLADE_UP = 22, BLADE_DOWN = -5;   // cutter-blade rotation around its pivot

const lines = gsap.utils.toArray('#crt-lines path');
const progress = gsap.utils.toArray('#crt-progress path');
const cutCards = gsap.utils.toArray('#cut-cards path');
const cardA = cutCards.slice(0, 3), cardB = cutCards.slice(3, 6);
const LINE_END = [714.7, 708.3, 717.9, 711.5, 705.1];
const cursorAt = (i, end) => {
  const dx = end ? LINE_END[i] - 697 : 0;
  return { x: dx, y: -15.6 + 3.2 * i + dx * 0.5 };
};

const osReduced = matchMedia('(prefers-reduced-motion: reduce)');
$('#rm').checked = osReduced.matches;
const reduced = () => $('#rm').checked;

const holds = {};   // per character: looping "still working" tween between its start and done
const who = (evt) => evt.split('_')[0];
const stopHold = (k) => { if (holds[k]) { holds[k].kill(); delete holds[k]; } };

// Depth: the printout lives in the printer's layer, but on the stamping table it must sit
// behind the stamp carousel. Same coordinate space, so moving the node keeps its transform.
const printoutEl = $('#printout');
const printoutHome = printoutEl.nextElementSibling;
const toLayer = (before) => () => before.parentNode.insertBefore(printoutEl, before);

function log(msg) {
  const el = $('#log');
  el.textContent += `${(performance.now() / 1000).toFixed(2).padStart(7)}s  ${msg}\n`;
  el.scrollTop = el.scrollHeight;
}

// Walk in a straight line (no bob), facing the direction of travel. Duration follows distance.
function walk(tl, who, from, to, pos) {
  const d = Math.hypot(to.x - from.x, to.y - from.y);
  return tl
    .set(`#${who}-flip`, { scaleX: to.x < from.x ? -1 : 1 }, pos)
    .to(`#${who === 'tr' ? 'translator' : who === 'ch' ? 'chopper' : 'archivist'}`,
        { ...at(to), duration: Math.max(0.6, d / WALK_SPEED), ease: 'power1.inOut' });
}
const face = (tl, who, left) => tl.set(`#${who}-flip`, { scaleX: left ? -1 : 1 });
const popCheck = (tl, sel, origin) => tl.fromTo(sel, { opacity: 0, scale: 0.4, svgOrigin: origin },
  { opacity: 1, scale: 1, duration: 0.3, ease: 'back.out(2)' });

function reset() {
  Object.keys(holds).forEach(stopHold);
  // characters
  gsap.set('#chopper', at(P.chSpot));
  gsap.set('#translator', at(P.trSpot));
  gsap.set('#archivist', at(P.arSpot));
  gsap.set(['#ch-flip', '#tr-flip', '#ar-flip'], { svgOrigin: '40 0' });
  gsap.set('#ch-flip', { scaleX: -1 });               // Chopper faces the bench (left)
  gsap.set(['#tr-flip', '#ar-flip'], { scaleX: 1 });
  gsap.set(['#ch-arm-down', '#ch-tool-down', '#tr-arm-r', '#ar-arm-down'], { opacity: 1 });
  gsap.set(['#ch-arm-up', '#tr-stamp-arm', '#tr-stamp-held', '#ar-arm-up'], { opacity: 0, y: 0 });
  gsap.set('#tr-stamp-press', { y: 0 });
  gsap.set(['#ch-held-env', '#ch-held-card', '#ar-held-page'], { opacity: 0 });
  gsap.set(['#ch-check', '#tr-check', '#ar-check'], { opacity: 0 });
  // Chopper's bench
  gsap.set('#envelope', { y: 0, opacity: 0 });   // no mail yet
  gsap.set('#cutter-sheet', { y: 0, opacity: 0 });
  gsap.set(cutCards, { opacity: 0 });
  gsap.set('#cutter-blade', { rotation: 0, svgOrigin: '372.8 354.8' });
  // Translator's desk
  gsap.set('#in-card', { x: 0, y: 0, opacity: 0 });
  gsap.set('#crt-text-idle', { opacity: 1 });
  gsap.set([...lines, ...progress], { opacity: 0 });
  gsap.set('#crt-cursor', { x: 0, y: 0, opacity: 0 });
  gsap.set('#printer', { x: 0 });
  gsap.set('#printer-led', { opacity: 0.3 });
  toLayer(printoutHome)();
  gsap.set('#printout', { x: 0, y: 0, opacity: 0 });
  gsap.set('#stamp-mark', { opacity: 0 });
  // Archivist's cabinets
  gsap.set('#cabinet-drawer', { x: 12, y: -6, opacity: 0 });
}

// One chop: blade + scissors arm come down together.
function chop(tl, onHit) {
  tl.to('#cutter-blade', { rotation: BLADE_DOWN, duration: 0.14, ease: 'power2.in' })
    .to('#ch-arm-up', { y: 6, duration: 0.14, ease: 'power2.in' }, '<');
  if (onHit) onHit(tl);
  return tl.to('#cutter-blade', { rotation: BLADE_UP, duration: 0.3, ease: 'power1.out' })
    .to('#ch-arm-up', { y: 0, duration: 0.3, ease: 'power1.out' }, '<');
}

// ---------- scenes: each returns a paused timeline ----------
const scenes = {
  chopper_start() {
    const tl = gsap.timeline({ paused: true });
    tl.add(reset)
      .fromTo('#envelope', { y: -10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: 'power2.out' });   // mail arrives on top of the inbox
    walk(tl, 'ch', P.chSpot, P.chInbox, '-=0.2');
    tl.to('#envelope', { y: -8, opacity: 0, duration: 0.3 })          // take the document
      .set('#ch-held-env', { opacity: 1 }, '<0.15');
    walk(tl, 'ch', P.chInbox, P.chSpot, '+=0.15');
    face(tl, 'ch', true)                                               // back to the bench
      .set('#ch-held-env', { opacity: 0 })
      .fromTo('#cutter-sheet', { y: -4, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3 })
      .set(['#ch-arm-down', '#ch-tool-down'], { opacity: 0 })
      .set('#ch-arm-up', { opacity: 1 })
      .to('#cutter-blade', { rotation: BLADE_UP, duration: 0.25 });
    tl.eventCallback('onComplete', () => {
      if (reduced()) return;
      // "Still chunking": keep chopping until chopper_done arrives.
      holds.chopper = chop(gsap.timeline({ repeat: -1, repeatDelay: 0.15 }));
    });
    return tl;
  },

  chopper_done() {
    const tl = gsap.timeline({ paused: true });
    tl.to('#cutter-blade', { rotation: BLADE_UP, duration: 0.1 });
    chop(tl, (t) => t.set(cardA, { opacity: 1 }).to('#cutter-sheet', { opacity: 0.5, duration: 0.1 }, '<'));
    chop(tl, (t) => t.set(cardB, { opacity: 1 }).to('#cutter-sheet', { opacity: 0, duration: 0.1 }, '<'));
    tl.to('#cutter-blade', { rotation: 0, duration: 0.25 })
      .set('#ch-arm-up', { opacity: 0 })
      .set(['#ch-arm-down', '#ch-tool-down'], { opacity: 1 })
      .set(cardB, { opacity: 0 }, '+=0.2')                             // pick up the top card
      .set('#ch-held-card', { opacity: 1 }, '<');
    walk(tl, 'ch', P.chSpot, P.chTray, '+=0.1');
    tl.set('#ch-held-card', { opacity: 0 })                            // drop it in the in-tray
      .fromTo('#in-card', { x: -8, y: 4, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 0.35, ease: 'power2.out' }, '<')
      .addLabel('handoff');   // card is in the tray: the Translator can start while the Chopper walks back
    walk(tl, 'ch', P.chTray, P.chSpot, '+=0.2');
    popCheck(tl, '#ch-check', '18 50');
    return tl;
  },

  translator_start() {
    const tl = gsap.timeline({ paused: true });
    tl.to('#in-card', { opacity: 0, y: -6, duration: 0.35 })          // card picked up
      .to('#crt-text-idle', { opacity: 0, duration: 0.2 }, '<')
      .set('#crt-cursor', { opacity: 1, ...cursorAt(0, false) });
    lines.forEach((line, i) => {
      tl.set('#crt-cursor', cursorAt(i, false))
        .to(line, { opacity: 1, duration: 0.05 })
        .to('#crt-cursor', { ...cursorAt(i, true), duration: 0.3, ease: 'steps(6)' }, '<');
    });
    tl.to([...lines, '#crt-cursor'], { opacity: 0, duration: 0.2 }, '+=0.3')
      .to(progress.slice(0, 3), { opacity: 1, duration: 0.05, stagger: 0.35 });
    tl.eventCallback('onComplete', () => {
      if (reduced()) return;
      // "Still embedding": the last progress block pulses until translator_done arrives.
      holds.translator = gsap.fromTo(progress[3], { opacity: 0.15 },
        { opacity: 0.8, duration: 0.45, repeat: -1, yoyo: true, ease: 'sine.inOut' });
    });
    return tl;
  },

  translator_done() {
    const tl = gsap.timeline({ paused: true });
    // print
    tl.to(progress[3], { opacity: 1, duration: 0.1 })
      .addLabel('print')
      .to('#printer-led', { opacity: 1, duration: 0.08, repeat: 7, yoyo: true }, 'print')
      .fromTo('#printer', { x: -0.7 }, { x: 0.7, duration: 0.06, repeat: 11, yoyo: true, ease: 'none' }, 'print')
      .set('#printer', { x: 0 })
      .fromTo('#printout', { x: 10, y: -5, opacity: 0 },
              { x: 0, y: 0, opacity: 1, duration: 0.8, ease: 'power1.out' }, 'print+=0.1')
      .set('#printer-led', { opacity: 0.3 })
    // walk to stamping while the printout moves to the table
      .addLabel('walk', '+=0.2')
      .to('#translator', { ...at(P.trStamp), duration: 1.2, ease: 'power1.inOut' }, 'walk')
      .to('#printout', { ...PRINTOUT_ON_TABLE, duration: 1.2, ease: 'power1.inOut' }, 'walk')
      .call(toLayer($('#stamp-carousel')))
    // stamp x3
      .set('#tr-arm-r', { opacity: 0 })
      .set('#tr-stamp-arm', { opacity: 1 });
    for (let i = 0; i < 3; i++) {
      tl.to('#tr-stamp-press', { y: 16, duration: 0.14, ease: 'power2.in' }, i ? '+=0.08' : '+=0.15');
      if (i === 0) tl.set('#stamp-mark', { opacity: 1 });
      tl.to('#tr-stamp-press', { y: 0, duration: 0.2, ease: 'power2.out' });
    }
    tl.addLabel('handoff')   // stamped: the Archivist can come for it while the Translator walks back
      .set('#tr-stamp-arm', { opacity: 0 })
      .set('#tr-arm-r', { opacity: 1 });
    walk(tl, 'tr', P.trStamp, P.trSpot, '+=0.2');
    face(tl, 'tr', false)
      .to(progress, { opacity: 0, duration: 0.2 })
      .to('#crt-text-idle', { opacity: 1, duration: 0.2 }, '<');
    popCheck(tl, '#tr-check', '62 50');
    return tl;
  },

  archivist_start() {
    const tl = gsap.timeline({ paused: true });
    // Go round the front of the book cart (a straight line would pass behind it).
    walk(tl, 'ar', P.arSpot, P.arAround);
    walk(tl, 'ar', P.arAround, P.arTable);
    tl.to('#printout', { x: PRINTOUT_ON_TABLE.x + 8, y: PRINTOUT_ON_TABLE.y + 4, opacity: 0, duration: 0.3 }, '+=0.1')
      .set('#ar-held-page', { opacity: 1 }, '<0.15');
    walk(tl, 'ar', P.arTable, P.arAround, '+=0.15');
    walk(tl, 'ar', P.arAround, P.arSpot);
    face(tl, 'ar', false)                                               // face the cabinets
      .to('#cabinet-drawer', { x: 0, y: 0, opacity: 1, duration: 0.4, ease: 'power2.out' })
      .set('#ar-held-page', { opacity: 0 })
      .set('#ar-arm-down', { opacity: 0 }, '<')
      .set('#ar-arm-up', { opacity: 1 }, '<');
    tl.eventCallback('onComplete', () => {
      if (reduced()) return;
      // "Still storing": hold the folder over the open drawer, nudging it, until archivist_done.
      holds.archivist = gsap.to('#ar-arm-up', { y: 3, duration: 0.5, repeat: -1, yoyo: true, ease: 'sine.inOut' });
    });
    return tl;
  },

  archivist_done() {
    const tl = gsap.timeline({ paused: true });
    tl.to('#ar-arm-up', { y: 12, duration: 0.3, ease: 'power2.in' })    // drop it in
      .set('#ar-arm-up', { opacity: 0, y: 0 })
      .set('#ar-arm-down', { opacity: 1 })
      .to('#cabinet-drawer', { x: 12, y: -6, duration: 0.35, ease: 'power2.in' }, '+=0.15')
      .set('#cabinet-drawer', { opacity: 0 });
    popCheck(tl, '#ar-check', '62 50');
    return tl;
  },
};

// ---------- event queue: one scene at a time, each end state held >= MIN_HOLD ----------
const queue = [];
let running = false;
let cancelScene = null;   // lets reset unblock a scene whose timeline was killed

function status() {
  $('#status').textContent = `queue: [${queue.join(', ')}]${running ? ' · playing' : ''}`;
}

function emit(evt) {
  queue.push(evt);
  log(`event  ${evt} (queued: ${queue.length})`);
  status();
  if (!running) drain();
}

async function drain() {
  running = true;
  while (queue.length) {
    const evt = queue.shift();
    status();
    stopHold(who(evt));   // this character's next event ends its "still working" loop
    const tl = scenes[evt]();
    log(`scene  ${evt} ${reduced() ? '(reduced: jump to end)' : `(${tl.duration().toFixed(2)}s)`}`);
    const handoff = tl.labels.handoff;
    await new Promise((resolve) => {
      cancelScene = resolve;
      if (handoff !== undefined) tl.call(resolve, null, handoff);
      tl.eventCallback('onComplete', ((done) => () => { done && done(); resolve(); })(tl.eventCallback('onComplete')));
      if (reduced()) tl.progress(1); else tl.play();
    });
    // A handoff lets the next character start at once while this scene's tail keeps playing.
    // Otherwise (and always under reduced motion) the end state stays up for MIN_HOLD.
    if (handoff === undefined || reduced()) await new Promise((r) => setTimeout(r, MIN_HOLD * 1000));
  }
  running = false;
  status();
}

document.querySelectorAll('button.evt').forEach((b) => b.addEventListener('click', () => emit(b.dataset.evt)));
$('#burst').addEventListener('click', () => EVENTS.forEach(emit));
$('#reset').addEventListener('click', () => {
  queue.length = 0;
  gsap.globalTimeline.getChildren().forEach((t) => t.kill());
  reset();
  if (cancelScene) cancelScene();
  log('reset');
  status();
});
$('#spots').addEventListener('change', (e) => gsap.set('#spots', { opacity: e.target.checked ? 0.8 : 0 }));
osReduced.addEventListener('change', (e) => { $('#rm').checked = e.matches; });

gsap.set('#spots', { opacity: 0 });
reset();
status();
window.__room = { emit, scenes, reset };   // for screenshot scrubbing
// ?play: loop the whole cycle on its own (the Ask office alternates a normal run and a "nothing found" run)
if (new URLSearchParams(location.search).has('play')) {
  const runs = ['#burst'];
  let n = 0;
  const go = () => { $('#reset').click(); $(runs[n++ % runs.length]).click(); };
  let idle = 0;   // seconds the office has been idle; start the next run after 3
  setInterval(() => { idle = running || queue.length ? 0 : idle + 1; if (idle >= 3) { idle = 0; go(); } }, 1000);
  go();
}
</script>
</body>
</html>
