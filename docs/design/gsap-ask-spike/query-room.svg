<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="400" height="180">
  <!-- Flat Query room from RoomQuery.dc.html; its HTML overlays (counter, bell, Back soon card) are redrawn as SVG. -->
  <defs>
    <linearGradient id="qClBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D6BC86"></stop><stop offset="0.6" stop-color="#C4A770"></stop><stop offset="1" stop-color="#AC8F5A"></stop>
    </linearGradient>
    <linearGradient id="qClHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E2DFD8"></stop><stop offset="0.6" stop-color="#D3CFC7"></stop><stop offset="1" stop-color="#BFBAB1"></stop>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="400" height="180" fill="#B48A62"></rect>
  <rect x="0" y="110" width="400" height="70" fill="#8F6747"></rect>
  <rect x="0" y="107" width="400" height="5" fill="#C9A47C"></rect>
  <rect x="44" y="16" width="92" height="164" fill="#5E3F28"></rect>
  <g id="q-door-shut">
    <rect x="50" y="22" width="80" height="158" fill="#8C5E3C"></rect>
    <rect x="58" y="62" width="64" height="40" fill="none" stroke="#6E4A2F" stroke-width="2"></rect>
    <rect x="58" y="110" width="64" height="62" fill="none" stroke="#6E4A2F" stroke-width="2"></rect>
    <circle cx="122" cy="118" r="3.5" fill="#E1C27A"></circle>
    <rect x="60" y="32" width="60" height="16" rx="1" fill="#F1E7D2"></rect>
    <text x="90" y="43.5" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-weight="700" font-size="8" letter-spacing="1.2" fill="#4A3426">STAFF ONLY</text>
  </g>
  <g id="q-door-open" opacity="0">
    <rect x="50" y="22" width="80" height="158" fill="#2B1F17"></rect>
    <path d="M50 22 L94 30 L94 174 L50 180 Z" fill="#7E5536"></path>
    <circle cx="88" cy="112" r="3" fill="#E1C27A"></circle>
  </g>
  <!-- decorations (added): framed picture, wall clock, tall plant -->
  <g id="q-decor">
    <rect x="150" y="32" width="44" height="34" rx="1.5" fill="#7E5638"></rect>
    <rect x="154" y="36" width="36" height="26" fill="#C9D6C2"></rect>
    <path d="M154 62 L166 50 L175 58 L183 51 L190 56 L190 62 Z" fill="#6F8A6E"></path>
    <circle cx="181" cy="43" r="3.5" fill="#E8A866"></circle>
    <circle cx="232" cy="46" r="13" fill="#EFE6D6" stroke="#6B5440" stroke-width="2"></circle>
    <path d="M232 46 V37.5 M232 46 L238 49.5" stroke="#4A3426" stroke-width="1.8" stroke-linecap="round"></path>
    <circle cx="232" cy="46" r="1.4" fill="#4A3426"></circle>
    <ellipse cx="378" cy="104" rx="10" ry="32" fill="#5D6B41" transform="rotate(-16 378 104)"></ellipse>
    <ellipse cx="384" cy="100" rx="10" ry="36" fill="#6F7F4F" transform="rotate(14 384 100)"></ellipse>
    <ellipse cx="372" cy="118" rx="7" ry="20" fill="#56643C" transform="rotate(-38 372 118)"></ellipse>
  </g>
  <rect x="300" y="34" width="56" height="44" rx="2" fill="#7E5638"></rect>
  <rect x="305" y="39" width="46" height="34" fill="#EFE8DA"></rect>
  <text x="328" y="54" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-weight="700" font-size="7.5" fill="#6B5440">ALL FACTS</text>
  <text x="328" y="65" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-weight="700" font-size="7.5" fill="#6B5440">NO FICTION</text>
  <!-- Clerk, from CharClerk.dc.html at 1.45x (front view plus back view for leaving). GSAP moves #q-clerk. -->
  <g id="q-clerk">
    <g transform="translate(32 24) scale(1.45)">
      <ellipse cx="40" cy="116" rx="30" ry="9" fill="#000000" opacity="0.2"></ellipse>
      <g id="q-front">
        <g id="q-wave-arms">
          <rect x="19" y="24" width="10" height="38" rx="5" fill="#B89A62" transform="rotate(-24 24 58)"></rect>
          <rect x="58" y="54" width="10" height="34" rx="5" fill="#B89A62"></rect>
        </g>
        <g id="q-shrug-arms" opacity="0">
          <rect x="12" y="54" width="10" height="30" rx="5" fill="#B89A62" transform="rotate(38 17 56)"></rect>
          <rect x="58" y="54" width="10" height="30" rx="5" fill="#B89A62" transform="rotate(-38 63 56)"></rect>
        </g>
        <g id="q-present-arms" opacity="0">
          <rect x="13" y="54" width="10" height="30" rx="5" fill="#B89A62" transform="rotate(-10 18 56)"></rect>
          <rect x="57" y="54" width="10" height="30" rx="5" fill="#B89A62" transform="rotate(10 62 56)"></rect>
        </g>
        <rect x="18" y="46" width="44" height="70" rx="20" fill="url(#qClBody)"></rect>
        <path d="M32 47 L40 63 L48 47" stroke="#6F8FA3" stroke-width="1.6" fill="none"></path>
        <rect x="35.5" y="62" width="9" height="11" rx="1" fill="#F7F2E8" stroke="#8C7660" stroke-width="0.8"></rect>
        <rect x="37" y="64" width="3.5" height="3.5" fill="#B9A97E"></rect>
        <path d="M37 70 H43" stroke="#B8AD98" stroke-width="1"></path>
        <circle cx="40" cy="28" r="17" fill="url(#qClHead)"></circle>
        <path d="M24 21 Q40 26 56 21" stroke="#4E6B55" stroke-width="3" fill="none" stroke-linecap="round"></path>
        <path d="M25 22 Q40 36 55 22 Q40 28 25 22 Z" fill="#8FB39A" fill-opacity="0.85"></path>
        <g id="q-wave-clip">
          <rect x="44" y="66" width="21" height="27" rx="1.5" fill="#8C6D46"></rect>
          <rect x="46" y="70" width="17" height="21" fill="#F7F2E8"></rect>
          <rect x="50" y="64" width="9" height="4" rx="1" fill="#9AA0A6"></rect>
          <path d="M48 75 H61 M48 79 H61 M48 83 H57" stroke="#B8AD98" stroke-width="1"></path>
        </g>
        <g id="q-present-page" opacity="0">
          <rect x="22" y="60" width="36" height="34" rx="1" fill="#F7F2E8" stroke="#C9BFA8" stroke-width="0.8"></rect>
          <path d="M26 66 H54 M26 71 H50 M26 76 H54 M26 81 H46" stroke="#B8AD98" stroke-width="1.2"></path>
          <rect x="47" y="84" width="8" height="6" rx="1" fill="#7A5236"></rect>
          <path d="M49 87 L51 89 L54 85" stroke="#F7F2E8" stroke-width="1.2" fill="none"></path>
        </g>
      </g>
      <g id="q-back" opacity="0">
        <rect x="12" y="54" width="10" height="34" rx="5" fill="#B89A62"></rect>
        <rect x="58" y="54" width="10" height="34" rx="5" fill="#B89A62"></rect>
        <rect x="18" y="46" width="44" height="70" rx="20" fill="url(#qClBody)"></rect>
        <path d="M40 54 L40 108" stroke="#AC8F5A" stroke-width="1"></path>
        <path d="M30 47 Q40 53 50 47" stroke="#6F8FA3" stroke-width="1.6" fill="none"></path>
        <circle cx="41" cy="28" r="17" fill="url(#qClHead)"></circle>
        <path d="M23 25 Q41 33 59 25" stroke="#4E6B55" stroke-width="3" fill="none" stroke-linecap="round"></path>
        <path d="M56 19 Q64 22 62 27 Q59 25 56 25 Z" fill="#8FB39A" fill-opacity="0.85"></path>
        <rect x="64" y="64" width="6" height="30" rx="1" fill="#8C6D46"></rect>
        <rect x="64" y="66" width="2" height="26" fill="#F7F2E8"></rect>
      </g>
    </g>
  </g>
  <!-- counter (in front of the Clerk), bell and the Back soon card -->
  <rect x="0" y="140" width="400" height="6" fill="#9C6B45"></rect>
  <rect x="0" y="146" width="400" height="34" fill="#7E5536"></rect>
  <path d="M124 140 V130.2 A14 9.8 0 0 1 152 130.2 V140 Z" fill="#C9A47C"></path>
  <rect x="124" y="137" width="28" height="3" fill="#8C6D46"></rect>
  <g id="q-counter-props">
    <path d="M206 127 L203 112 M210 127 L212 110 M214 127 L219 114" stroke="#3A302A" stroke-width="1.6" stroke-linecap="round"></path>
    <circle cx="219" cy="114" r="1.6" fill="#A63A2B"></circle>
    <rect x="202" y="126" width="16" height="14" rx="2" fill="#56677A"></rect>
    <rect x="202" y="126" width="16" height="3" rx="1" fill="#6F7F96"></rect>
    <rect x="236" y="136" width="40" height="4" rx="0.5" fill="#E6DDCB"></rect>
    <rect x="238" y="133" width="38" height="3.5" rx="0.5" fill="#F7F2E8" stroke="#D8CCB7" stroke-width="0.6"></rect>
    <rect x="235" y="130" width="38" height="3.5" rx="0.5" fill="#FBF6EC" stroke="#D8CCB7" stroke-width="0.6"></rect>
    <text x="254" y="129" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-weight="600" font-size="5" letter-spacing="0.6" fill="#6A5848">QUESTIONS</text>
  </g>
  <g id="q-back-soon" opacity="0">
    <rect x="48" y="119.5" width="70" height="19" rx="3" fill="#F1E7D2" stroke="#8C6D46" stroke-width="1"></rect>
    <text x="83" y="133" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-weight="600" font-size="11" fill="#4A3426">Back soon</text>
  </g>
</svg>
