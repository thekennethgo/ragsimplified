<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Character · Scout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; line-height: 0;">
<svg viewBox="0 0 80 120" width="100%" role="img" aria-label="{{label}}" style="display: block; overflow: visible;">
  <defs>
    <linearGradient id="scBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B3C1CE"></stop>
      <stop offset="0.6" stop-color="#9FAEBC"></stop>
      <stop offset="1" stop-color="#8696A5"></stop>
    </linearGradient>
    <linearGradient id="scHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E2DFD8"></stop>
      <stop offset="0.6" stop-color="#D3CFC7"></stop>
      <stop offset="1" stop-color="#BFBAB1"></stop>
    </linearGradient>
  </defs>
  <ellipse cx="40" cy="116" rx="30" ry="9" fill="#000000" opacity="0.18"></ellipse>
  <g transform="{{flip}}">
    <rect x="12" y="54" width="10" height="34" rx="5" fill="#93A3B2"></rect>
    <g opacity="{{armDown}}">
      <rect x="58" y="54" width="10" height="34" rx="5" fill="#93A3B2"></rect>
    </g>

    <rect x="18" y="46" width="44" height="70" rx="20" fill="url(#scBody)"></rect>
    <path d="M40 54 L40 108" stroke="#8696A5" stroke-width="1"></path>
    <path d="M12 64 H22" stroke="#B9C6D2" stroke-width="3"></path>
    <path d="M32 47 L40 50 L48 47" stroke="#C9D3DC" stroke-width="3" fill="none" stroke-linejoin="round"></path>
    <path d="M40 52 L40 96" stroke="#8696A5" stroke-width="1.2"></path>
    <path d="M28 54 Q40 58 52 54" stroke="#8696A5" stroke-width="1" fill="none"></path>
    <path d="M19 96 H61" stroke="#4A4541" stroke-width="4"></path>
    <path d="M27 94 V98 M53 94 V98" stroke="#2F2A26" stroke-width="1.5"></path>
    <path d="M47 47 Q52 52 50 62 L47 68 L45 62 Q46 54 44 48 Z" fill="#7E5A5A"></path>
    <path d="M45.5 52 L48.5 54 M45 57 L49 59" stroke="#B39A8A" stroke-width="1"></path>
    <circle cx="41" cy="28" r="17" fill="url(#scHead)"></circle>
    <path d="M56 22 L62 30" stroke="#5B6E8A" stroke-width="2.5" stroke-linecap="round"></path>
    <g opacity="{{armUp}}">
      <rect x="58" y="30" width="10" height="30" rx="5" fill="#93A3B2"></rect>
      <path d="M58 46 H68" stroke="#B9C6D2" stroke-width="3"></path>
    </g>
    <g opacity="{{toolDown}}">
      <path d="M58 64 H68" stroke="#B9C6D2" stroke-width="3"></path>
    </g>

  </g>
  <g opacity="{{doneMark}}">
    <circle cx="{{checkX}}" cy="50" r="7" fill="#6E8F66"></circle>
    <path d="{{checkPath}}" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
  </g>
  <rect x="8" y="122" width="64" height="15" rx="2" fill="#3A2A20"></rect>
  <text x="40" y="132" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-weight="600" font-size="8" letter-spacing="0.8" fill="#EADAC0">SCOUT</text>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["waiting","working","done"],"default":"working"},"facing":{"editor":"enum","options":["right","left"],"default":"left"},"$preview":{"width":160,"height":280}}'>
class Component extends DCLogic {
  renderVals() {
    const state = this.props.state ?? 'working';
    const left = (this.props.facing ?? 'left') === 'left';
    const working = state === 'working';
    const done = state === 'done';
    const cx = left ? 18 : 62;
    return {
      flip: left ? 'translate(80 0) scale(-1 1)' : '',
      armUp: working ? 1 : 0,
      armDown: working ? 0 : 1,
      toolDown: working ? 0 : 1,
      doneMark: done ? 1 : 0,
      checkX: cx,
      checkPath: 'M' + (cx - 3.5) + ' 50 L' + (cx - 1) + ' 52.8 L' + (cx + 3.8) + ' 47.2',
      label: 'The Scout: an office guy, a muted blue bean-shaped figure with a light grey head in a short-sleeve dress shirt, belt, tie flipped back over the shoulder and a pen behind the ear, seen from behind, ' + (working ? 'pointing at the file drawers the lantern lights up.' : done ? 'finished searching.' : 'waiting by the file cabinets.')
    };
  }
}
</script>
</body>
</html>
