<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Character · Clerk</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; line-height: 0;">
<svg viewBox="0 0 80 120" width="100%" role="img" aria-label="{{label}}" style="display: block; overflow: visible;">
  <defs>
    <linearGradient id="clBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D6BC86"></stop>
      <stop offset="0.6" stop-color="#C4A770"></stop>
      <stop offset="1" stop-color="#AC8F5A"></stop>
    </linearGradient>
    <linearGradient id="clHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E2DFD8"></stop>
      <stop offset="0.6" stop-color="#D3CFC7"></stop>
      <stop offset="1" stop-color="#BFBAB1"></stop>
    </linearGradient>
  </defs>
  <ellipse cx="40" cy="116" rx="30" ry="9" fill="#000000" opacity="0.2"></ellipse>

  <g opacity="{{front}}">
    <g opacity="{{wave}}">
      <rect x="19" y="24" width="10" height="38" rx="5" fill="#B89A62" transform="rotate(-24 24 58)"></rect>
      <rect x="58" y="54" width="10" height="34" rx="5" fill="#B89A62"></rect>
    </g>
    <g opacity="{{present}}">
      <rect x="13" y="54" width="10" height="30" rx="5" fill="#B89A62" transform="rotate(-10 18 56)"></rect>
      <rect x="57" y="54" width="10" height="30" rx="5" fill="#B89A62" transform="rotate(10 62 56)"></rect>
    </g>
    <g opacity="{{shrug}}">
      <rect x="12" y="54" width="10" height="30" rx="5" fill="#B89A62" transform="rotate(38 17 56)"></rect>
      <rect x="58" y="54" width="10" height="30" rx="5" fill="#B89A62" transform="rotate(-38 63 56)"></rect>
    </g>
    <rect x="18" y="46" width="44" height="70" rx="20" fill="url(#clBody)"></rect>
    <path d="M32 47 L40 63 L48 47" stroke="#6F8FA3" stroke-width="1.6" fill="none"></path>
    <rect x="35.5" y="62" width="9" height="11" rx="1" fill="#F7F2E8" stroke="#8C7660" stroke-width="0.8"></rect>
    <rect x="37" y="64" width="3.5" height="3.5" fill="#B9A97E"></rect>
    <path d="M37 70 H43" stroke="#B8AD98" stroke-width="1"></path>
    <circle cx="40" cy="28" r="17" fill="url(#clHead)"></circle>
    <path d="M24 21 Q40 26 56 21" stroke="#4E6B55" stroke-width="3" fill="none" stroke-linecap="round"></path>
    <path d="M25 22 Q40 36 55 22 Q40 28 25 22 Z" fill="#8FB39A" fill-opacity="0.85"></path>
    <g opacity="{{wave}}">
      <rect x="44" y="66" width="21" height="27" rx="1.5" fill="#8C6D46"></rect>
      <rect x="46" y="70" width="17" height="21" fill="#F7F2E8"></rect>
      <rect x="50" y="64" width="9" height="4" rx="1" fill="#9AA0A6"></rect>
      <path d="M48 75 H61 M48 79 H61 M48 83 H57" stroke="#B8AD98" stroke-width="1"></path>
    </g>
    <g opacity="{{present}}">
      <rect x="22" y="60" width="36" height="34" rx="1" fill="#F7F2E8" stroke="#C9BFA8" stroke-width="0.8"></rect>
      <path d="M26 66 H54 M26 71 H50 M26 76 H54 M26 81 H46" stroke="#B8AD98" stroke-width="1.2"></path>
      <rect x="47" y="84" width="8" height="6" rx="1" fill="#7A5236"></rect>
      <path d="M49 87 L51 89 L54 85" stroke="#F7F2E8" stroke-width="1.2" fill="none"></path>
    </g>
  </g>

  <g opacity="{{back}}">
    <g transform="{{flip}}">
      <rect x="12" y="54" width="10" height="34" rx="5" fill="#B89A62"></rect>
      <rect x="58" y="54" width="10" height="34" rx="5" fill="#B89A62" opacity="{{backWait}}"></rect>
      <rect x="18" y="46" width="44" height="70" rx="20" fill="url(#clBody)"></rect>
      <path d="M40 54 L40 108" stroke="#AC8F5A" stroke-width="1"></path>
      <path d="M30 47 Q40 53 50 47" stroke="#6F8FA3" stroke-width="1.6" fill="none"></path>
      <circle cx="41" cy="28" r="17" fill="url(#clHead)"></circle>
      <path d="M23 25 Q41 33 59 25" stroke="#4E6B55" stroke-width="3" fill="none" stroke-linecap="round"></path>
      <path d="M56 19 Q64 22 62 27 Q59 25 56 25 Z" fill="#8FB39A" fill-opacity="0.85"></path>
      <g opacity="{{backWait}}">
        <rect x="64" y="64" width="6" height="30" rx="1" fill="#8C6D46"></rect>
        <rect x="64" y="66" width="2" height="26" fill="#F7F2E8"></rect>
      </g>
      <g opacity="{{backGive}}">
        <rect x="58" y="38" width="10" height="26" rx="5" fill="#B89A62" transform="rotate(30 63 60)"></rect>
        <rect x="66" y="28" width="18" height="22" rx="1.5" fill="#8C6D46"></rect>
        <rect x="68" y="31" width="14" height="17" fill="#F7F2E8"></rect>
        <path d="M70 36 H80 M70 40 H80 M70 44 H77" stroke="#B8AD98" stroke-width="1"></path>
      </g>
    </g>
  </g>

  <rect x="8" y="122" width="64" height="15" rx="2" fill="#F2C27E"></rect>
  <text x="40" y="132" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-weight="700" font-size="8" letter-spacing="0.8" fill="#33261D">CLERK</text>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"pose":{"editor":"enum","options":["wave","present","shrug","wait","give"],"default":"wave"},"facing":{"editor":"enum","options":["front","left","right"],"default":"front"},"$preview":{"width":160,"height":280}}'>
class Component extends DCLogic {
  renderVals() {
    const facing = this.props.facing ?? 'front';
    const isFront = facing === 'front';
    const pose = this.props.pose ?? 'wave';
    const say = {
      wave: 'waving hello with a clipboard in hand',
      present: 'holding up the finished answer',
      shrug: 'shrugging, empty-handed',
      wait: 'waiting with a clipboard at their side',
      give: 'handing over a clipboard with your question'
    }[pose] || 'waiting';
    return {
      front: isFront ? 1 : 0,
      back: isFront ? 0 : 1,
      flip: facing === 'left' ? 'translate(80 0) scale(-1 1)' : '',
      wave: pose === 'wave' || pose === 'wait' ? 1 : 0,
      present: pose === 'present' ? 1 : 0,
      shrug: pose === 'shrug' ? 1 : 0,
      backWait: pose === 'give' ? 0 : 1,
      backGive: pose === 'give' ? 1 : 0,
      label: 'The Clerk: a mustard bean-shaped figure with a light grey head, a green accountant\'s visor and a lanyard with an ID badge, ' + (isFront ? 'facing you, ' : 'seen from behind, ') + say + '.'
    };
  }
}
</script>
</body>
</html>
