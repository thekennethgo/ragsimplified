<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Query room art</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 100%; overflow: hidden; border-radius: 6px; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #33261D; background: #B48A62;">
  <svg viewBox="0 0 400 180" width="100%" role="img" aria-label="{{label}}" style="display: block;">
    <rect x="0" y="0" width="400" height="180" fill="#B48A62"></rect>
    <rect x="0" y="110" width="400" height="70" fill="#8F6747"></rect>
    <rect x="0" y="107" width="400" height="5" fill="#C9A47C"></rect>
    <rect x="44" y="16" width="92" height="164" fill="#5E3F28"></rect>
    <g opacity="{{doorShut}}">
      <rect x="50" y="22" width="80" height="158" fill="#8C5E3C"></rect>
      <rect x="58" y="62" width="64" height="40" fill="none" stroke="#6E4A2F" stroke-width="2"></rect>
      <rect x="58" y="110" width="64" height="62" fill="none" stroke="#6E4A2F" stroke-width="2"></rect>
      <circle cx="122" cy="118" r="3.5" fill="#E1C27A"></circle>
      <rect x="60" y="32" width="60" height="16" rx="1" fill="#F1E7D2"></rect>
      <text x="90" y="43.5" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-weight="700" font-size="8" letter-spacing="1.2" fill="#4A3426">STAFF ONLY</text>
    </g>
    <g opacity="{{doorOpen}}">
      <rect x="50" y="22" width="80" height="158" fill="#2B1F17"></rect>
      <path d="M50 22 L94 30 L94 174 L50 180 Z" fill="#7E5536"></path>
      <circle cx="88" cy="112" r="3" fill="#E1C27A"></circle>
    </g>
    <rect x="300" y="34" width="56" height="44" rx="2" fill="#7E5638"></rect>
    <rect x="305" y="39" width="46" height="34" fill="#EFE8DA"></rect>
    <text x="328" y="54" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-weight="700" font-size="7.5" fill="#6B5440">ALL FACTS</text>
    <text x="328" y="65" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-weight="700" font-size="7.5" fill="#6B5440">NO FICTION</text>
    <rect x="150" y="32" width="44" height="34" rx="1.5" fill="#7E5638"></rect>
    <rect x="154" y="36" width="36" height="26" fill="#C9D6C2"></rect>
    <path d="M154 62 L166 50 L175 58 L183 51 L190 56 L190 62 Z" fill="#6F8A6E"></path>
    <circle cx="181" cy="43" r="3.5" fill="#E8A866"></circle>
    <circle cx="232" cy="46" r="13" fill="#EFE6D6" stroke="#6B5440" stroke-width="2"></circle>
    <path d="M232 46 V37.5 M232 46 L238 49.5" stroke="#4A3426" stroke-width="1.8" stroke-linecap="round"></path>
    <circle cx="232" cy="46" r="1.4" fill="#4A3426"></circle>
    <ellipse cx="378" cy="104" rx="10" ry="32" fill="#5D6B41" transform="rotate(-16 378 104)"></ellipse>
    <ellipse cx="384" cy="100" rx="10" ry="36" fill="#6F7F4F" transform="rotate(14 384 100)"></ellipse>
    <ellipse cx="372" cy="118" rx="7" ry="20" fill="#56643C" transform="rotate(-38 372 118)"></ellipse>
  </svg>
  <div style="position: absolute; left: 8%; top: 13.3%; width: 29%; pointer-events: none; opacity: {{clerkShown}};">
    <dc-import name="CharClerk" pose="{{pose}}" facing="front" hint-size="100%,170px"></dc-import>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 22.2%; background: #7E5536; border-top: 6px solid #9C6B45; box-sizing: border-box;"></div>
  <div style="position: absolute; left: 31%; bottom: 22.2%; width: 7%; aspect-ratio: 1 / 0.7; border-radius: 50% 50% 0 0; background: #C9A47C; box-shadow: inset 0 -3px 0 #8C6D46;"></div>
  <svg viewBox="0 0 400 180" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none;">
    <path d="M206 127 L203 112 M210 127 L212 110 M214 127 L219 114" stroke="#3A302A" stroke-width="1.6" stroke-linecap="round"></path>
    <circle cx="219" cy="114" r="1.6" fill="#A63A2B"></circle>
    <rect x="202" y="126" width="16" height="14" rx="2" fill="#56677A"></rect>
    <rect x="202" y="126" width="16" height="3" rx="1" fill="#6F7F96"></rect>
    <rect x="236" y="136" width="40" height="4" rx="0.5" fill="#E6DDCB"></rect>
    <rect x="238" y="133" width="38" height="3.5" rx="0.5" fill="#F7F2E8" stroke="#D8CCB7" stroke-width="0.6"></rect>
    <rect x="235" y="130" width="38" height="3.5" rx="0.5" fill="#FBF6EC" stroke="#D8CCB7" stroke-width="0.6"></rect>
    <text x="254" y="129" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-weight="600" font-size="5" letter-spacing="0.6" fill="#6A5848">QUESTIONS</text>
  </svg>
  <div style="position: absolute; left: 12%; bottom: 23%; padding: 3px 8px; border: 1px solid #8C6D46; border-radius: 3px; background: #F1E7D2; font-size: 11px; font-weight: 600; color: #4A3426; opacity: {{doorOpen}};">Back soon</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"here":{"editor":"boolean","default":true},"pose":{"editor":"enum","options":["wave","present","shrug"],"default":"wave"},"$preview":{"width":400,"height":180}}'>
class Component extends DCLogic {
  renderVals() {
    const here = this.props.here ?? true;
    return {
      pose: this.props.pose ?? 'wave',
      clerkShown: here ? 1 : 0,
      doorShut: here ? 1 : 0,
      doorOpen: here ? 0 : 1,
      label: here ? 'A small reception room: the Clerk stands behind a counter in front of a door marked Staff only. On the wall: a framed landscape, a clock and a sign that says All facts, no fiction; a tall plant in the corner, and a pen cup and a stack of question forms on the counter.' : 'A small reception room: the counter is empty, a Back soon card sits on it, and the door marked Staff only stands open.'
    };
  }
}
</script>
</body>
</html>
