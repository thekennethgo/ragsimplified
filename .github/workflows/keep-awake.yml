name: keep-awake

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (UTC)
    - cron: "0 6 * * *"      # once a day (UTC)
  workflow_dispatch:         # allows you to manually trigger it

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Always runs on every 10-min cron AND manual trigger
      - name: Ping Health Endpoint
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "$BACKEND_URL/health"
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}

      # Step 2: Runs ONLY during the 6:00 AM cron OR when you press "Run Workflow" manually
      - name: Touch Database
        if: |
          github.event_name == 'workflow_dispatch' || 
          github.event.schedule == '0 6 * * *'
        run: curl -fsS --max-time 90 "$BACKEND_URL/library" > /dev/null
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
